#opn{display:none;margin-left:auto}

#tb{gap:6px;align-items:flex-start}

.gh{font-weight:700;border:0;background:transparent;padding:4px 6px}
.gb{display:flex;flex-wrap:wrap;gap:4px}.gb[hidden]{display:none}
html,body{height:100%}body{display:flex;flex-direction:column}main{flex:1;min-height:0;height:auto}
@media(max-width:760px){html,body{height:auto}body{display:block}}

<script>
(function(){try{const d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';d.innerHTML='<i></i><i></i>';document.body.append(d);const ok=d.scrollHeight===1;d.remove();if(!ok)document.documentElement.classList.add('no-fg')}catch(e){}})();
const $=s=>document.querySelector(s);

/* ---------- Math (simplified LaTeX) ---------- */

  if(c==='\\'){const m=/^[a-zA-Z]+/.exec(s.slice(i));if(!m){o+=esc(s[i++]||'');continue}i+=m[0].length;const n=m[0];
   if(n==='frac'||n==='binom'){const a=grp(),b=grp(),bn=n==='binom';o+=(bn?'(':'')+'<span class="fr'+(bn?' nb':'')+'"><span>'+a+'</span><span>'+b+'</span></span>'+(bn?')':'')}
   else if(n==='sqrt'||n==='overline')o+=(n==='sqrt'?'√':'')+'<span class="sq">'+grp()+'</span>';
   else if(ACC[n])o+='<span class="acc" data-a="'+ACC[n]+'">'+grp()+'</span>';

 return seq('')}

 for(const t of spec.split(/[\s,;]+/).filter(Boolean)){
  const kv=/^([a-z]+)=(.+)$/.exec(t);

 return r.length===1&&r[0][0]===c.q?[]:r}
const AC={open:false,items:[],sel:0,q:''};
function acHide(){$('#ac').hidden=true;AC.open=false}
function acShow(){const ta=$('#src'),box=$('#ac');if(!AC.items.length){acHide();return}
 box.innerHTML=AC.items.map((x,i)=>'<div class="ai'+(i===AC.sel?' on':'')+'" data-i="'+i+'"><span class="ak">'+esc(x[3])+'</span><span class="al">'+esc(x[0])+'</span><span class="ad">'+esc(TR(x[2]))+'</span></div>').join('');
 const mir=$('#mir');mir.textContent=ta.value.slice(0,ta.selectionStart);const sp=document.createElement('span');sp.textContent='\u200b';mir.append(sp);
 box.hidden=false;const ed=$('#ed'),h=box.offsetHeight;let y=sp.offsetTop+24;
 if(y+h>ed.scrollTop+ed.clientHeight&&sp.offsetTop-h-4>=ed.scrollTop)y=sp.offsetTop-h-4;
 box.style.left=Math.max(0,Math.min(sp.offsetLeft,$('#edin').clientWidth-box.offsetWidth-4))+'px';box.style.top=y+'px';AC.open=true}
function acUpdate(){const c=cands();AC.items=c?filt(c):[];AC.q=c?c.q:'';AC.sel=0;acShow()}
function acAccept(i){const x=AC.items[i];if(!x)return;const ta=$('#src'),p=ta.selectionStart,st=p-AC.q.length,k=x[1].indexOf('$0');
 ta.setRangeText(x[1].replace('$0',''),st,p,'end');if(k>=0)ta.setSelectionRange(st+k,st+k);acHide();render();ta.focus()}
$('#src').addEventListener('input',e=>{if(e.inputType&&e.inputType.startsWith('delete')){acHide();return}acUpdate()});
$('#src').addEventListener('keydown',e=>{if(!AC.open||e.isComposing)return;const n=AC.items.length;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();AC.sel=(AC.sel+(e.key==='ArrowDown'?1:n-1))%n;acShow()}
 else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();acAccept(AC.sel)}
 else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();acHide()}});
$('#src').addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key))acHide()});
$('#src').addEventListener('blur',()=>setTimeout(acHide,150));

const SAMPLE=['// Mixdown 예제','@style','h1: color=tomato center','h2: color=teal','','# Mixdown에 오신 것을 환영합니다','','**Markdown**과 *간결한 LaTeX*, CSS, 약간의 JS를 한 문서에서 씁니다.','','## 수식','','인라인: $E = mc^2$, 그리고 $\\alpha + \\beta_1 \\le \\pi$','','$$ x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a} $$','','## 꾸미기','','{{빨간 큰 글씨|red big bold}} 와 {{노란 배경|bg=yellow color=black pad=2px}}','','::: card center','영역 전체를 꾸밀 수 있어요.',':::','','## 계산','','@var n = 0','@var 이름 = "친구"','@input 이름 "이름 입력"','','안녕하세요, {이름}님! 버튼을 {n}번 눌렀어요.','','@button "+1" : n = n + 1','@button "x2" : n = n * 2','@button "초기화" : n = 0','','## 섞어 쓰기','','**굵게 안의 수식 $\\alpha^2$ 와 `코드`**, {{**굵은 빨강** 과 $\\frac{1}{2}$|red}}, {{현재 값 {n}|blue big}}','','[$\\pi$ 링크](https://example.com) 와 \\$5 처럼 기호는 이스케이프','','| 수식 | 꾸밈 |','|---|---|','| $x^2$ | {{빨강|red bold}} |','','## 고급','','@var size = 20','@var list = [1, 2, 3]','','{{크기가 변하는 글자|size=@size:px color=blue bold}}','','@button "키우기" : size += 4','@button "줄이기" : size = Math.max(8, size - 4)','@button "합계" : n = 0; for (const x of list) { n += x }','','크기 {size}px, 두 배는 {= size * 2}, 길이 {= list.length}, 변환 {= list.map(x => x * 2).join(", ")}','','@if size > 30','::: card','글자가 30px보다 커졌어요!',':::','@else','아직 작아요.','@end','','수식에 변수: $x = \\v{size}^2 + \\sum_{i=1}^{n} i$','','$$ A = \\pmatrix{1 & 2 \\\\ 3 & 4}, \\quad \\lim_{x \\to 0} \\frac{\\sin x}{x} = 1 $$','','- [x] 체크리스트','- [ ] 두 번째','  - 하위 항목 ==형광펜==','','> 인용문도 됩니다.','','| 기능 | 상태 |','|---|---|','| 표 | 지원 |','','- 목록 하나','- 목록 둘'].join('\n');
let DL=null;try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
const note=m=>{let e=$('#note');if(!e){e=document.createElement('div');e.id='note';e.style.cssText='font-size:13px;color:var(--mu);flex-basis:100%';$('#tb2').after(e)}e.textContent=m};
const fname=()=>((/^#\s+(.+)$/m.exec($('#src').value)||[])[1]||'document').replace(/[^\w\- 가-힣]/g,'').trim().slice(0,40)||'document';
async function save(name,data){
 if(!DL){if(window.top===window){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);note(TR('저장했어요: ')+name)}else note(TR('이 화면에서는 파일 저장을 쓸 수 없어요. 내용을 직접 복사해 주세요.'));return}
 try{await DL.save({filename:name,data});note(TR('저장했어요: ')+name)}
 catch(e){if(e.code==='declined')return;
  if(e.code==='rejected_extension'&&name.endsWith('.mxd')){try{await DL.save({filename:name+'.txt',data});note(TR('이 환경은 .mxd 확장자 저장을 허용하지 않아 ')+name+TR('.txt 로 저장했어요. 이 제한은 claude.ai 안에서만 있고, 내려받은 HTML 파일로 열면 .mxd로 바로 저장돼요. (또는 저장 후 뒤의 .txt를 지우세요.)'));return}catch(e2){if(e2.code==='declined')return}}
  note(TR('저장하지 못했어요 (')+(e.code||TR('오류'))+')')}}
function importFile(){imp.click()}
const imp=document.createElement('input');imp.type='file';imp.accept='.mxd,.txt,text/plain';imp.hidden=true;document.body.append(imp);
imp.onchange=async()=>{const f=imp.files[0];if(f){$('#src').value=await f.text();render();note(f.name+TR(' 을(를) 불러왔어요'))}imp.value=''};
[['내보내기 (.mxd)',()=>save(fname()+'.mxd',$('#src').value)],['HTML 내보내기',()=>save(fname()+'.html',$('#code').textContent)],['가져오기',()=>importFile()]].forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.onclick=f;$('#tbt').append(b)});
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('mx-theme',t)}catch(e){}};
try{const t=localStorage.getItem('mx-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
const dlg=document.createElement('div');dlg.id='dlg';dlg.hidden=true;
function buildDlg(){dlg.innerHTML='<div class="box" role="dialog" aria-label="'+TR('설정')+'"><h2>'+TR('설정')+'</h2><div class="row"><span>'+TR('언어')+'</span><select id="lg"><option value="ko">한국어</option><option value="en">English</option></select></div><div class="row" style="margin-top:12px"><span>'+TR('테마')+'</span><label><input type="radio" name="th" value="light"> '+TR('화이트')+'</label><label><input type="radio" name="th" value="dark"> '+TR('다크')+'</label></div><div class="row" style="margin-top:12px"><label><input type="checkbox" id="pn"> '+TR('정확한 이름 사용')+'</label></div><div class="hint">'+TR('버튼 이름을 실제 문법 이름(Markdown, LaTeX, CSS, JS)으로 바꿉니다.')+'</div><div class="act"><button id="dx">'+TR('닫기')+'</button></div></div>'}
buildDlg();
document.body.append(dlg);
function syncDlg(){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');dlg.querySelectorAll('input[name=th]').forEach(r=>{r.checked=r.value===cur});dlg.querySelector('#lg').value=LANG;dlg.querySelector('#pn').checked=PN}
function openSet(){syncDlg();dlg.hidden=false}
function applyLang(){document.documentElement.lang=LANG;
 document.querySelectorAll('header h1,.tabs>button,#tbt button,#tb2 button,#cls').forEach(e=>{const k=e.dataset.k||(e.dataset.k=e.textContent);e.textContent=TR(k)});
 $('#fsb').textContent=TR($('#pvcol').classList.contains('fs')?'전체화면 닫기':'전체화면');applyNames();buildHelp()}
function setLang(l){const old=LANG,src=$('#src');LANG=l;try{localStorage.setItem('mx-lang',l)}catch(e){}if(src.value===SAMPLES[old])src.value=SAMPLES[l];buildDlg();syncDlg();applyLang();render()}
dlg.addEventListener('change',e=>{if(e.target.name==='th')setTheme(e.target.value);if(e.target.id==='lg')setLang(e.target.value);if(e.target.id==='pn'){PN=e.target.checked;try{localStorage.setItem('mx-pn',PN?'1':'0')}catch(x){}applyNames()}});
function applyNames(){document.querySelectorAll('#tb .gb button').forEach(b=>{const n=b.dataset.n;b.textContent=PN?(PREC[n]||n):TR(n)});document.querySelectorAll('#tb .gh').forEach(h=>{const n=h.dataset.n;h.textContent=h.textContent.slice(0,2)+(PN?(PG[n]||n):TR(n))})}
applyNames();applyLang();
dlg.addEventListener('click',e=>{if(e.target===dlg||e.target.id==='dx')dlg.hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!dlg.hidden)dlg.hidden=true});
const col=$('#pvcol'),mn=document.querySelector('main');
$('#cls').onclick=()=>{col.classList.remove('fs');$('#fsb').textContent=TR('전체화면');mn.classList.add('nopv')};
$('#opn').onclick=()=>mn.classList.remove('nopv');

addEventListener('keydown',e=>{if(e.key==='Escape'&&col.classList.contains('fs'))$('#fsb').click()});
const SAMPLE_EN="// Mixdown example\n@style\nh1: color=tomato center\nh2: color=teal\n\n# Welcome to Mixdown\n\n**Markdown** blends *simplified LaTeX*, CSS and a bit of JS in one document.\n\n## Math\n\nInline: $E = mc^2$, and $\\alpha + \\beta_1 \\le \\pi$\n\n$$ x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a} $$\n\n## Styling\n\n{{Big red text|red big bold}} and {{yellow background|bg=yellow color=black pad=2px}}\n\n::: card center\nWhole blocks can be styled too.\n:::\n\n## Calculation\n\n@var n = 0\n@var name = \"friend\"\n@input name \"Type your name\"\n\nHello, {name}! You pressed the button {n} times.\n\n@button \"+1\" : n = n + 1\n@button \"x2\" : n = n * 2\n@button \"Reset\" : n = 0\n\n## Mixing\n\n**Math $\\alpha^2$ and `code` inside bold**, {{**bold red** and $\\frac{1}{2}$|red}}, {{current value {n}|blue big}}\n\n[$\\pi$ link](https://example.com) and an escaped symbol like \\$5\n\n| Math | Styling |\n|---|---|\n| $x^2$ | {{red|red bold}} |\n\n## Advanced\n\n@var size = 20\n@var list = [1, 2, 3]\n\n{{Text that changes size|size=@size:px color=blue bold}}\n\n@button \"Grow\" : size += 4\n@button \"Shrink\" : size = Math.max(8, size - 4)\n@button \"Sum\" : n = 0; for (const x of list) { n += x }\n\nSize {size}px, double is {= size * 2}, length {= list.length}, mapped {= list.map(x => x * 2).join(\", \")}\n\n@if size > 30\n::: card\nThe text grew past 30px!\n:::\n@else\nStill small.\n@end\n\nVariable in math: $x = \\v{size}^2 + \\sum_{i=1}^{n} i$\n\n$$ A = \\pmatrix{1 & 2 \\\\ 3 & 4}, \\quad \\lim_{x \\to 0} \\frac{\\sin x}{x} = 1 $$\n\n- [x] Checklist\n- [ ] Second item\n  - Sub-item ==highlight==\n\n> Blockquotes work too.\n\n| Feature | Status |\n|---|---|\n| Table | Supported |\n\n- List item one\n- List item two";
const SAMPLES={ko:SAMPLE,en:SAMPLE_EN};
$('#src').value=SAMPLES[LANG];render();

/* ---------- Desktop app integration (Qt WebChannel) ---------- */
(function(){
 if(!(window.qt&&qt.webChannelTransport&&window.QWebChannel))return;
 new QWebChannel(qt.webChannelTransport,function(ch){
  const B=ch.objects.bridge;let CUR='';
  const call=(m,...a)=>new Promise(r=>B[m](...a,r));
  const parse=s=>{try{return s?JSON.parse(s):null}catch(e){return null}};
  const title=n=>{document.title=(n?n+' - ':'')+'Mixdown'};
  const load=d=>{if(!d)return;CUR=d.path;$('#src').value=d.text;render();title(d.name);note(d.name+TR(' 을(를) 불러왔어요'))};
  const put=async(name,data,saveAs)=>{const ext=name.split('.').pop();const r=parse(await call('saveFile',data,name,ext,ext==='mxd'?CUR:'',!!saveAs));if(r){if(ext==='mxd'){CUR=r.path;title(r.name)}note(TR('저장했어요: ')+r.name)}};
  importFile=async()=>load(parse(await call('openFile')));
  save=(name,data)=>put(name,data,true);
  B.menuAction.connect(a=>{const v=$('#src').value;
   if(a==='open')importFile();
   else if(a==='save')put(fname()+'.mxd',v,false);
   else if(a==='saveas')put(fname()+'.mxd',v,true);
   else if(a==='html')put(fname()+'.html',$('#code').textContent,true)});
  B.fileOpened.connect(s=>load(parse(s)));
  call('initialFile').then(s=>load(parse(s)));
 });
})();
</script>
